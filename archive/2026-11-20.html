<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily SE Mini Friday, 2026-11-20</title>

    <style>
    :root {
        --grid-size: min(90vw, 520px);
        --cell-size: calc(var(--grid-size) / 10);

        --radius: 12px;

        --blue: #2563eb;
        --blue-dark: #1d4ed8;
        --blue-light: #dbeafe;

        --border: #cbd5e1;
        --text: #1e293b;
        --text-secondary: #64748b;

        --success: #0cff0c1a;
        --error: #fee2e2;
    }

    body {
        font-family:
            Inter,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            sans-serif;

        background: #f8fafc;
        color: var(--text);

        max-width: 900px;
        margin: 0 auto;
        padding: 24px 16px;

        line-height: 1.5;
    }

    h2 {
        text-align: center;
        margin-bottom: 24px;
        font-size: clamp(1.5rem, 5vw, 2rem);
    }

    h3 {
        margin-top: 1.5rem;
    }

    /* Crossword */

    #grid {
        --cell-size: calc(min(90vw, 520px) / var(--cols));

        display: grid;
        grid-template-columns: repeat(var(--cols), var(--cell-size));

        width: max-content;
        margin: 0 auto;

        padding: 6px;
        gap: 2px;

        background: var(--border);
        border-radius: var(--radius);
    }

    .cell {
        aspect-ratio: 1;

        background: white;
        border: 1px solid var(--border);

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;
        box-sizing: border-box;
    }

    .cell input {
        width: 100%;
        height: 100%;

        border: none;
        outline: none;

        background: transparent;

        text-align: center;
        text-transform: uppercase;

        font-size: clamp(16px, 4vw, 26px);
        font-weight: 600;
    }

    .clue-cell {
        background: var(--blue-light);
        color: #1e3a8a;

        font-size: clamp(14px, 3vw, 22px);
        font-weight: 700;
    }

    .transparent {
        background: none;
        border: none;
    }

    .cell input.correct {
        background: var(--success);
    }

    .cell input.incorrect {
        background: var(--error);
    }

    /* Clues */

    #Ledtrådar {
        margin-top: 32px;
        padding: 20px;

        background: white;
        border-radius: var(--radius);

        box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    #Ledtrådar ul {
        padding-left: 20px;
    }

    #Ledtrådar li {
        margin-bottom: 8px;
    }

    /* Buttons */

    #validateBtn,
    .toggle-button,
    .submit-button {
        border: none;
        cursor: pointer;

        transition:
            background .2s ease,
            transform .15s ease;
    }

    #validateBtn:hover,
    .toggle-button:hover,
    .submit-button:hover {
        transform: translateY(-1px);
    }

    #validateBtn:active,
    .toggle-button:active,
    .submit-button:active {
        transform: translateY(0);
    }

    #validateBtn {
        display: block;

        margin: 24px auto;
        padding: 12px 24px;

        background: var(--blue);
        color: white;

        border-radius: 10px;

        font-size: 16px;
        font-weight: 600;
    }

    .toggle-button,
    .submit-button {
        background: var(--blue);
        color: white;
    }

    .toggle-button:hover,
    .submit-button:hover {
        background: var(--blue-dark);
    }

    .submit-button {
        flex-shrink: 0;

        padding: 8px 14px;

        border-radius: 6px;
        font-weight: 600;
    }

    .submit-button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
    }

    /* Accessibility */

    input:focus,
    button:focus-visible {
        outline: 3px solid #60a5fa;
        outline-offset: 2px;
    }

    /* AI Section */

    .toolbar {
        margin-bottom: 12px;
    }

    .component-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .component-list.collapsed {
        display: none;
    }

    .submit-component {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 12px;

        padding: 14px;

        background: white;

        border: 1px solid #e2e8f0;
        border-radius: var(--radius);

        box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
    }

    .submit-content {
        flex: 1 1 250px;

        overflow-wrap: anywhere;
        word-break: break-word;
    }

    .secondary {
        color: var(--text-secondary);
    }

    .archive-link-container {
        text-align: center;
        margin: 16px 0 32px;
    }

    .archive-link {
        display: inline-block;

        padding: 10px 18px;

        color: var(--blue);
        background: white;

        border: 1px solid var(--border);
        border-radius: var(--radius);

        font-weight: 600;
        text-decoration: none;

        transition:
            background .2s ease,
            border-color .2s ease,
            transform .15s ease;
    }

    .archive-link:hover {
        background: #f1f5f9;
        border-color: var(--blue);

        transform: translateY(-1px);
    }

    .archive-link:active {
        transform: translateY(0);
    }
    </style>
</head>
<body>

<h2>Daily SE Mini Friday, 2026-11-20</h2>

<div id="grid"></div>

<button id="validateBtn">Validate</button>

<div id="Ledtrådar">
    <h3>Vågrätt</h3>
    <ul id="horizontalClueList"></ul>
    <h3>Lodrätt</h3>
    <ul id="verticalClueList"></ul>
</div>

<div class="archive-link-container">
    <a id="archive-link" href="./archive/index.html" class="archive-link">
        📚 Browse Puzzle Archive
    </a>
</div>

<div class="toolbar">
    <button id="toggleButton" class="toggle-button">
        Show AI Generated Clues
    </button>
</div>

<div id="aiGenClueList" class="component-list collapsed"></div>

<script>
// ------------------------------
// Crossword Data Structure
// ------------------------------
    const crossword = {
        	cols: 12, 
	rows: 12, 
solution: [ 
		[null, null, "1", null, null, "2", "3", "4", null, null, null, null, ],
		[null, "5", "k", "6", "7", "n", "e", "j", "8", "9", null, null, ],
		["10", "g", "i", "f", "t", "11", "t", "u", "n", "g", null, null, ],
		["12", "r", "r", "a", "j", null, "13", "n", "e", "r", "14", null, ],
		["15", "a", "k", "k", "u", "16", "m", "o", "r", "b", "o", null, ],
		["17", "n", "18", "e", "g", "19", "20", "21", "a", "b", "b", null, ],
		[null, "22", "t", "23", "o", "s", "v", "24", "k", "y", "l", null, ],
		["25", "m", "m", "26", "s", "i", "27", "k", "a", "p", null, null, ],
		["28", "a", "29", "m", "e", "t", "a", "l", null, null, null, null, ],
		["30", "r", "31", "f", "x", "a", "a", "o", "32", "33", null, null, ],
		["34", "s", "o", "l", "35", "r", "a", "n", "c", "h", null, null, ],
		[null, null, null, null, null, null, null, null, null, null, null, null, ],
	],
        horizontalClues: [
{ number: 5, clue: "Symbolen för kemiskt grundämne kalium" }, 
{ number: 7, clue: "inte imponerad av förslaget" }, 
{ number: 10, clue: "inte bara något dödligt" }, 
{ number: 11, clue: "motsats till lätt" }, 
{ number: 12, clue: "Två R följda av ett smärtutrop, hopskrivet." }, 
{ number: 13, clue: "motsats till upp" }, 
{ number: 15, clue: "Uppladdningsbart batteri på tyska" }, 
{ number: 16, clue: "nyhetsankare som ogillar mänskligheten" }, 
{ number: 17, clue: "Kemisk symbol för kväve" }, 
{ number: 18, clue: "Engelsk förkortning för ”for example”, skriven utan punkter." }, 
{ number: 21, clue: "industrikoncern med svenska rötter" }, 
{ number: 22, clue: "korsets favoritbokstav" }, 
{ number: 23, clue: "listan fortsätter i samma stil" }, 
{ number: 24, clue: "kall matförvaring" }, 
{ number: 25, clue: "listan fortsätter lite till" }, 
{ number: 26, clue: "Tonstavelsen mellan la och do i den internationella do-re-mi-skalan" }, 
{ number: 27, clue: "del av en bok" }, 
{ number: 28, clue: "först ut i alfabetet" }, 
{ number: 29, clue: "när volymratten blir en rekommendation" }, 
{ number: 30, clue: "bokstav som många skorr" }, 
{ number: 31, clue: "Sjätte bokstaven i alfabetet, romerskt tecken för tio, första vokalen två gånger och sedan sista vokalen." }, 
{ number: 34, clue: "solgud i Rom" }, 
{ number: 35, clue: "amerikansk dressingfavorit" }, 
],  
verticalClues: [
{ number: 1, clue: "sci-fi kapten på Enterprise" }, 
{ number: 2, clue: "Bokstaven efter M i svenska alfabetet" }, 
{ number: 3, clue: "Fransk motsvarighet till svenskans ”och”." }, 
{ number: 4, clue: "gudarnas drottning" }, 
{ number: 5, clue: "vanligt julträd" }, 
{ number: 6, clue: "något som inte är vad det verkar" }, 
{ number: 7, clue: "antal svarta rutor på ett schackbräde delat med två" }, 
{ number: 8, clue: "mörk stad i Dragonlance" }, 
{ number: 9, clue: "Sätt ihop gemenerna g och r, därefter två b och slutligen y och p." }, 
{ number: 13, clue: "Bokstaven före N." }, 
{ number: 14, clue: "Förkortning för obligatorisk, ofta i en kursplan" }, 
{ number: 18, clue: "Symbolen för rättigheterna på en cool uppfinning" }, 
{ number: 19, clue: "indiskt instrument med många strängar" }, 
{ number: 20, clue: "halva w" }, 
{ number: 22, clue: "Planet och månad" }, 
{ number: 24, clue: "genetisk kopia" }, 
{ number: 26, clue: "fler personer av samma sort" }, 
{ number: 27, clue: "liten batteri" }, 
{ number: 31, clue: "dyker ofta upp mellan två namn" }, 
{ number: 32, clue: "vanlig i engelsk stavning" }, 
{ number: 33, clue: "gömmer sig i hej" }, 
],
        ai_gen_clues: [
{ key: "rraj", clue: "Två R följda av ett smärtutrop, hopskrivet.", confidence: "91" }, 
{ key: "akku", clue: "Uppladdningsbart batteri på tyska", confidence: "96" }, 
{ key: "n", clue: "Kemisk symbol för kväve", confidence: "99" }, 
{ key: "eg", clue: "Engelsk förkortning för ”for example”, skriven utan punkter.", confidence: "98" }, 
{ key: "fxaao", clue: "Sjätte bokstaven i alfabetet, romerskt tecken för tio, första vokalen två gånger och sedan sista vokalen.", confidence: "78" }, 
{ key: "et", clue: "Fransk motsvarighet till svenskans ”och”.", confidence: "99" }, 
{ key: "grbbyp", clue: "Sätt ihop gemenerna g och r, därefter två b och slutligen y och p.", confidence: "98" }, 
{ key: "obl", clue: "Förkortning för obligatorisk, ofta i en kursplan", confidence: "96" }, 
]
    };

    let isAIGenSectionExpanded = false;

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");
grid.style.setProperty("--cols", 12);

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            cell.classList.add("clue-cell");
            cell.textContent = sol_content;
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const horizontalClueList = document.getElementById("horizontalClueList");
crossword.horizontalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    horizontalClueList.appendChild(li);
});

const verticalClueList = document.getElementById("verticalClueList");
crossword.verticalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    verticalClueList.appendChild(li);
});

// ------------------------------
// AI Generated Clues section
// ------------------------------

    const container = document.getElementById("aiGenClueList");
    const toggleButton = document.getElementById("toggleButton");

    function renderItems() {
        container.innerHTML = "";

        crossword.ai_gen_clues.forEach(item => {
            const component = document.createElement("div");

            component.className = "submit-component";

            component.innerHTML = `
                <div class="submit-content">
                    <b>${item.key}:</b>
                    ${item.clue}
                    <span class="secondary">(${item.confidence})</span>
                </div>

                <button
                    class="submit-button"
                    type="submit">
                    Godkänn
                </button>
            `;

            const button = component.querySelector(".submit-button");

            button.addEventListener("click", () => {
                submitClueToDB(button, item);
            });

            container.appendChild(component);
        });
    }

    function updateExpandedState() {
        container.classList.toggle("collapsed", !isAIGenSectionExpanded);

        toggleButton.textContent =
            isAIGenSectionExpanded ? "Stäng": "Visa AI genererade ledtrådar";
    }

    toggleButton.addEventListener("click", () => {
        isAIGenSectionExpanded = !isAIGenSectionExpanded;
        updateExpandedState();
    });

    async function submitClueToDB(button, item) {
        try {
            button.disabled = true;
            button.textContent = "...";

            const response = await fetch("https://sheetdb.io/api/v1/2ugi4z3mi964f", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    key: item.key,
                    clue: item.clue,
                    aI_gen_confidence: item.confidence
                })
            });

            if (!response.ok) {
                throw new Error("Request failed");
            }

            button.textContent = "Inskickad";
        }
        catch (error) {
            console.error(error);

            button.textContent = "Err";
        }
    }

    renderItems();
    updateExpandedState();

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value != "") {
            if (input.value.toUpperCase() === correct) {
                input.classList.remove("incorrect");
                input.classList.add("correct");
            } else {
                input.classList.remove("correct");
                input.classList.add("incorrect");
            }
        }
    });
    
    let all_correct = Array.from(inputs)
        .every(w => w.classList.contains("correct"));

    if (all_correct)
    {
        //todo: add some kind of celebration?

        const storage = loadStorageSet();
        storage.add("2026-11-20");
        saveStorageSet(storage);
    }
});

// ------------------------------
// Fix the link to the archive page to work before & after the page gets moved to Archive
// ------------------------------
document.addEventListener("DOMContentLoaded", () => {
    const archiveLinkElement = document.getElementById("archive-link");

    archiveLinkElement.href = window.location.pathname.includes("/archive/")
            ? "index.html"
            : "archive/index.html";
});


// ------------------------------
// Helper methods
// ------------------------------

const STORAGE_KEY = "dagens-mini-completed-dates";

function loadStorageSet() {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) {
        return new Set();
    }

    return new Set(JSON.parse(raw));
}

function saveStorageSet(set) {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify([...set])
    );
}

function isNumber(str) {
    const tryNum = Number(str);
    return !isNaN(tryNum);
}
</script>

</body>
</html>
