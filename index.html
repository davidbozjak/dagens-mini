<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily SE Mini Friday, 2026-11-27</title>

    <style>
    :root {
        --grid-size: min(90vw, 520px);
        --cell-size: calc(var(--grid-size) / 10);

        --radius: 12px;

        --blue: #2563eb;
        --blue-dark: #1d4ed8;
        --blue-light: #dbeafe;

        --border: #cbd5e1;
        --text: #1e293b;
        --text-secondary: #64748b;

        --success: #0cff0c1a;
        --error: #fee2e2;
    }

    body {
        font-family:
            Inter,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            sans-serif;

        background: #f8fafc;
        color: var(--text);

        max-width: 900px;
        margin: 0 auto;
        padding: 24px 16px;

        line-height: 1.5;
    }

    h2 {
        text-align: center;
        margin-bottom: 24px;
        font-size: clamp(1.5rem, 5vw, 2rem);
    }

    h3 {
        margin-top: 1.5rem;
    }

    /* Crossword */

    #grid {
        --cell-size: calc(min(90vw, 520px) / var(--cols));

        display: grid;
        grid-template-columns: repeat(var(--cols), var(--cell-size));

        width: max-content;
        margin: 0 auto;

        padding: 6px;
        gap: 2px;

        background: var(--border);
        border-radius: var(--radius);
    }

    .cell {
        aspect-ratio: 1;

        background: white;
        border: 1px solid var(--border);

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;
        box-sizing: border-box;
    }

    .cell input {
        width: 100%;
        height: 100%;

        border: none;
        outline: none;

        background: transparent;

        text-align: center;
        text-transform: uppercase;

        font-size: clamp(16px, 4vw, 26px);
        font-weight: 600;
    }

    .clue-cell {
        background: var(--blue-light);
        color: #1e3a8a;

        font-size: clamp(14px, 3vw, 22px);
        font-weight: 700;
    }

    .transparent {
        background: none;
        border: none;
    }

    .cell input.correct {
        background: var(--success);
    }

    .cell input.incorrect {
        background: var(--error);
    }

    /* Clues */

    #Ledtrådar {
        margin-top: 32px;
        padding: 20px;

        background: white;
        border-radius: var(--radius);

        box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    #Ledtrådar ul {
        padding-left: 20px;
    }

    #Ledtrådar li {
        margin-bottom: 8px;
    }

    /* Buttons */

    #validateBtn,
    .toggle-button,
    .submit-button {
        border: none;
        cursor: pointer;

        transition:
            background .2s ease,
            transform .15s ease;
    }

    #validateBtn:hover,
    .toggle-button:hover,
    .submit-button:hover {
        transform: translateY(-1px);
    }

    #validateBtn:active,
    .toggle-button:active,
    .submit-button:active {
        transform: translateY(0);
    }

    #validateBtn {
        display: block;

        margin: 24px auto;
        padding: 12px 24px;

        background: var(--blue);
        color: white;

        border-radius: 10px;

        font-size: 16px;
        font-weight: 600;
    }

    .toggle-button,
    .submit-button {
        background: var(--blue);
        color: white;
    }

    .toggle-button:hover,
    .submit-button:hover {
        background: var(--blue-dark);
    }

    .submit-button {
        flex-shrink: 0;

        padding: 8px 14px;

        border-radius: 6px;
        font-weight: 600;
    }

    .submit-button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
    }

    .submit-button.hidden  {
        display: none;
    }

    /* Accessibility */

    input:focus,
    button:focus-visible {
        outline: 3px solid #60a5fa;
        outline-offset: 2px;
    }

    /* AI Section */

    .toolbar {
        margin-bottom: 12px;
    }

    .component-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .component-list.collapsed {
        display: none;
    }

    .submit-component {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 12px;

        padding: 14px;

        background: white;

        border: 1px solid #e2e8f0;
        border-radius: var(--radius);

        box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
    }

    .submit-content {
        flex: 1 1 250px;

        overflow-wrap: anywhere;
        word-break: break-word;
    }

    .secondary {
        color: var(--text-secondary);
    }

    /* Archive link */

    .archive-link-container {
        text-align: center;
        margin: 16px 0 32px;
    }

    .archive-link {
        display: inline-block;

        padding: 10px 18px;

        color: var(--blue);
        background: white;

        border: 1px solid var(--border);
        border-radius: var(--radius);

        font-weight: 600;
        text-decoration: none;

        transition:
            background .2s ease,
            border-color .2s ease,
            transform .15s ease;
    }

    .archive-link:hover {
        background: #f1f5f9;
        border-color: var(--blue);

        transform: translateY(-1px);
    }

    .archive-link:active {
        transform: translateY(0);
    }
    
    /* Clue Pop-up */

    .clue-popup {
        position: fixed;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(15, 23, 42, 0.25);
        backdrop-filter: blur(2px);

        z-index: 1000;
    }

    .clue-popup.hidden {
        display: none;
    }

    .clue-popup-content {
        max-width: 85vw;
        padding: 20px;

        background: white;
        border-radius: var(--radius);

        border: 2px solid var(--blue);

        box-shadow: 0 8px 30px rgba(0,0,0,.15);

        text-align: center;
    }

    .clue-popup-number {
        color: var(--blue);
        font-weight: 700;
        font-size: 1.1rem;

        margin-bottom: 8px;
    }
 
    </style>
</head>
<body>

<h2>Daily SE Mini Friday, 2026-11-27</h2>

<div id="grid"></div>

<div id="cluePopup" class="clue-popup hidden">
    <div class="clue-popup-content">
        <div id="cluePopupNumber" class="clue-popup-number"></div>
        <div id="cluePopupText"></div>
    </div>
</div>

<button id="validateBtn">Validate</button>

<div id="Ledtrådar">
    <h3>Vågrätt</h3>
    <ul id="horizontalClueList"></ul>
    <h3>Lodrätt</h3>
    <ul id="verticalClueList"></ul>
</div>

<div class="archive-link-container">
    <a id="archive-link" href="./archive/index.html" class="archive-link">
        📚 Browse Puzzle Archive
    </a>
</div>

<div class="toolbar">
    <button id="toggleButton" class="toggle-button">
        Show AI Generated Clues
    </button>
</div>

<div id="aiGenClueList" class="component-list collapsed"></div>

<script>

const ADMIN_KEY = "always-42";

const params = new URLSearchParams(window.location.search);

if (params.get("admin") === ADMIN_KEY) {
    localStorage.setItem("isAdmin", "true");
    }

const isAdmin =
    localStorage.getItem("isAdmin") === "true";

// ------------------------------
// Crossword Data Structure
// ------------------------------
    const crossword = {
        	cols: 12, 
	rows: 12, 
solution: [ 
		[null, "1", "2", "3", null, null, null, null, null, "4", null, null, ],
		["5", "e", "e", "s", "6", null, null, "7", "8", "m", "9", null, ],
		[null, "10", "s", "k", "t", null, "11", "f", "g", "o", "k", null, ],
		[null, null, "12", "a", "a", "13", "k", "a", "i", "r", "o", null, ],
		[null, "14", "t", "r", "n", "r", "a", "t", "t", "t", "c", null, ],
		[null, "15", "v", "a", "k", "e", "n", "16", "17", "18", "k", null, ],
		[null, null, null, "19", "20", "a", "a", "t", "s", null, null, null, ],
		[null, null, "21", "g", "u", "l", "d", "e", "t", "22", "23", null, ],
		[null, null, "24", "o", "m", "i", "a", "n", "e", "s", "r", null, ],
		[null, null, "25", "n", "e", "s", "26", "n", "a", "j", "e", null, ],
		[null, null, "27", "g", "å", "m", null, "28", "m", "u", "n", null, ],
		[null, null, null, null, null, null, null, null, null, null, null, null, ],
	],
        horizontalClues: [
{ number: 5, clue: "inre marknad utan fullt medlemskap", answerLen: "3"}, 
{ number: 8, clue: "Bokstaven före N.", answerLen: "1"}, 
{ number: 10, clue: "något staten gärna tar del av", answerLen: "3"}, 
{ number: 11, clue: "Begynnelsebokstäverna i fika, glass, olja och kopp.", answerLen: "4"}, 
{ number: 12, clue: "Bokstaven a två gånger i följd", answerLen: "2"}, 
{ number: 13, clue: "Egyptens huvudstad", answerLen: "5"}, 
{ number: 14, clue: "Nio tecken i en kodföljd: t på plats 1, 6, 7 och 8; r på 2 och 4; n på 3; a på 5; c sist.", answerLen: "9"}, 
{ number: 15, clue: "motsats till trött", answerLen: "5"}, 
{ number: 18, clue: "Symbolen för kemiskt grundämne kalium", answerLen: "1"}, 
{ number: 20, clue: "Två svenska obestämda artiklar följda av begynnelsebokstäverna i «tak» och «sol»; skriv ihop allt.", answerLen: "4"}, 
{ number: 21, clue: "någon man inte vill tappa bort", answerLen: "6"}, 
{ number: 24, clue: "Engelsk pluralform av Romany", answerLen: "8"}, 
{ number: 25, clue: "Nintendos klassiska 8-bitarskonsol (förkortning)", answerLen: "3"}, 
{ number: 26, clue: "Dialektalt ord för ett nekande svar.", answerLen: "4"}, 
{ number: 27, clue: "Svenskt verb för att förflytta sig + bokstaven M, hopskrivet", answerLen: "3"}, 
{ number: 28, clue: "används när man talar", answerLen: "3"}, 
],  
verticalClues: [
{ number: 1, clue: "sveriges vanligaste vokal", answerLen: "1" }, 
{ number: 2, clue: "Spaniens toppdomän på internet", answerLen: "2" }, 
{ number: 3, clue: "västgötsk domkyrkostad", answerLen: "5" }, 
{ number: 4, clue: "dödens personifikation", answerLen: "4" }, 
{ number: 6, clue: "lagkamrat som gillar smärta", answerLen: "4" }, 
{ number: 7, clue: "serveringskärl", answerLen: "3" }, 
{ number: 8, clue: "sparar kod och relationer", answerLen: "3" }, 
{ number: 9, clue: "jobbar i kök", answerLen: "4" }, 
{ number: 11, clue: "Världens näst största land", answerLen: "6" }, 
{ number: 12, clue: "bildskärm i vardagsrum", answerLen: "2" }, 
{ number: 13, clue: "världen finns oavsett dig", answerLen: "7" }, 
{ number: 16, clue: "finns i lödtenn", answerLen: "4" }, 
{ number: 17, clue: "där reor är farligare än fiender", answerLen: "5" }, 
{ number: 19, clue: "när ett slag räcker", answerLen: "4" }, 
{ number: 20, clue: "Universitetsstad norr om Stockholm", answerLen: "4" }, 
{ number: 22, clue: "antal dagar i veckan", answerLen: "3" }, 
{ number: 23, clue: "samiskt dragdjur", answerLen: "3" }, 
],
        ai_gen_clues: [
{ key: "trnratttc", clue: "Nio tecken i en kodföljd: t på plats 1, 6, 7 och 8; r på 2 och 4; n på 3; a på 5; c sist.", confidence: "92" }, 
{ key: "aa", clue: "Bokstaven a två gånger i följd", confidence: "98" }, 
{ key: "omianesr", clue: "Engelsk pluralform av Romany", confidence: "94" }, 
{ key: "nes", clue: "Nintendos klassiska 8-bitarskonsol (förkortning)", confidence: "98" }, 
{ key: "gåm", clue: "Svenskt verb för att förflytta sig + bokstaven M, hopskrivet", confidence: "96" }, 
{ key: "aats", clue: "Två svenska obestämda artiklar följda av begynnelsebokstäverna i «tak» och «sol»; skriv ihop allt.", confidence: "96" }, 
{ key: "fgok", clue: "Begynnelsebokstäverna i fika, glass, olja och kopp.", confidence: "82" }, 
{ key: "naje", clue: "Dialektalt ord för ett nekande svar.", confidence: "78" }, 
]
    };

    let isAIGenSectionExpanded = false;

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");
grid.style.setProperty("--cols", 12);

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            cell.classList.add("clue-cell");
            cell.textContent = sol_content;

            cell.style.cursor = "pointer";

            cell.addEventListener("click", () => {
                showClue(Number(sol_content));
            });
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const horizontalClueList = document.getElementById("horizontalClueList");
crossword.horizontalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue} (${cl.answerLen})`;
    horizontalClueList.appendChild(li);
});

const verticalClueList = document.getElementById("verticalClueList");
crossword.verticalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}  (${cl.answerLen})`;
    verticalClueList.appendChild(li);
});

// ------------------------------
// AI Generated Clues section
// ------------------------------

    const container = document.getElementById("aiGenClueList");
    const toggleButton = document.getElementById("toggleButton");

    function renderItems() {
        container.innerHTML = "";

        crossword.ai_gen_clues.forEach(item => {
            const component = document.createElement("div");

            component.className = "submit-component";

            component.innerHTML = `
                <div class="submit-content">
                    <b>${item.key}:</b>
                    ${item.clue}
                    <span class="secondary">(${item.confidence})</span>
                </div>

                <button
                    class="submit-button"
                    type="submit">
                    Godkänn
                </button>
            `;

            const button = component.querySelector(".submit-button");
            
            if (!isAdmin)
            {
                button.classList.add("hidden");
            }
            else
            {
                button.addEventListener("click", () => {
                    submitClueToDB(button, item);
                });
            }

            container.appendChild(component);
        });
    }

    function updateExpandedState() {
        container.classList.toggle("collapsed", !isAIGenSectionExpanded);

        toggleButton.textContent =
            isAIGenSectionExpanded ? "Stäng": "Visa AI genererade ledtrådar";
    }

    toggleButton.addEventListener("click", () => {
        isAIGenSectionExpanded = !isAIGenSectionExpanded;
        updateExpandedState();
    });

    async function submitClueToDB(button, item) {
        try {
            button.disabled = true;
            button.textContent = "...";

            const response = await fetch("https://sheetdb.io/api/v1/2ugi4z3mi964f", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    key: item.key,
                    clue: item.clue,
                    aI_gen_confidence: item.confidence
                })
            });

            if (!response.ok) {
                throw new Error("Request failed");
            }

            button.textContent = "Inskickad";
        }
        catch (error) {
            console.error(error);

            button.textContent = "Err";
        }
    }

    renderItems();
    updateExpandedState();

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value != "") {
            if (input.value.toUpperCase() === correct) {
                input.classList.remove("incorrect");
                input.classList.add("correct");
            } else {
                input.classList.remove("correct");
                input.classList.add("incorrect");
            }
        }
    });
    
    let all_correct = Array.from(inputs)
        .every(w => w.classList.contains("correct"));

    if (all_correct)
    {
        //todo: add some kind of celebration?

        const storage = loadStorageSet();
        storage.add("2026-11-27");
        saveStorageSet(storage);
    }
});

// ------------------------------
// Fix the link to the archive page to work before & after the page gets moved to Archive
// ------------------------------
document.addEventListener("DOMContentLoaded", () => {
    const archiveLinkElement = document.getElementById("archive-link");

    archiveLinkElement.href = window.location.pathname.includes("/archive/")
            ? "index.html"
            : "archive/index.html";
});

//
// Clue Pop-up functionality
//

const popup = document.getElementById("cluePopup");
popup.addEventListener("click", hideClue);

const popupText = document.getElementById("cluePopupText");
const popupNumber = document.getElementById("cluePopupNumber");

function showClue(number) {

    let verticalClue = crossword.verticalClues.find(w => w.number == number);
    let horizontalClue = crossword.horizontalClues.find(w => w.number == number);

    let text;
    if (verticalClue != null && horizontalClue != null)
    {
        text = "<b>Vertical:</b> " + verticalClue.clue + " (" + verticalClue.answerLen + ")<br><b>Horizontal: </b>" + horizontalClue.clue + " (" + horizontalClue.answerLen + ")"; 
    }
    else if (verticalClue != null)
    {
        text = verticalClue.clue + " (" + verticalClue.answerLen + ")";
    }
    else if (horizontalClue != null)
    {
        text = horizontalClue.clue + " (" + horizontalClue.answerLen + ")";
    }
    else 
    {
        throw new Exception("Expecting at least one clue to be avaliable");
    }

    popupNumber.textContent = number;
    popupText.innerHTML = text;
    popup.classList.remove("hidden");
}

function hideClue() {
    popup.classList.add("hidden");
}

// ------------------------------
// Helper methods
// ------------------------------

const STORAGE_KEY = "dagens-mini-completed-dates";

function loadStorageSet() {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) {
        return new Set();
    }

    return new Set(JSON.parse(raw));
}

function saveStorageSet(set) {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify([...set])
    );
}

function isNumber(str) {
    const tryNum = Number(str);
    return !isNaN(tryNum);
}

</script>

</body>
</html>
