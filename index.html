
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily SE Mini Saturday, 2026-10-31</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 600px;
        margin: auto;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(10, 40px);
        gap: 4px;
        justify-content: center;
    }

    .cell {
        width: 40px;
        height: 40px;
        border: 1px solid #aaa;
        text-align: center;
        font-size: 22px;
        position: relative;
    }

    .cell input {
        width: 90%;
        height: 90%;
        border: none;
        text-align: center;
        font-size: 22px;
    }

    .clueBox {
        width: 40px;
        height: 40px;
        background: #e0e0e0;
        font-size: 16px;
        display: flex;
        align-items: center;   /* vertical centering */
        justify-content: center; /* horizontal centering */
        position: absolute;
        top: 0;
        left: 0;
        border-bottom-right-radius: 6px;
    }

    .transparent {
        background: none;
        border: none;
    }

    #validateBtn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 18px;
    }

    .correct {
        background-color: #cce6ff !important; /* light blue */
    }

    .incorrect {
        background-color: #ffcccc !important; /* light red */
    }

    #clues {
        margin-top: 30px;
    }

    @media (max-width: 480px) {
        #grid {
            grid-template-columns: repeat(10, 32px);
        }
        .cell {
            width: 32px;
            height: 32px;
        }
        .cell input {
            font-size: 18px;
        }
    }
</style>
</head>
<body>

<h2>Daily SE Mini Saturday, 2026-10-31</h2>

<div id="grid"></div>

<button id="validateBtn">Validate</button>

<div id="Ledtrådar">
    <h3>Vågrätt</h3>
    <ul id="horizontalClueList"></ul>
    <h3>Lodrätt</h3>
    <ul id="verticalClueList"></ul>
</div>

<script>
// ------------------------------
// Crossword Data Structure
// ------------------------------
const crossword = {
	cols: 10, 
	rows: 10, 
solution: [ 
		[null, null, null, "15", null, null, "9", null, null, null, ],
		[null, "11", "t", "h", "a", "r", "p", "12", null, null, ],
		[null, "10", "r", "u", "n", "w", "a", "y", "5", null, ],
		["16", "y", "o", "d", "a", "2", "v", "x", "b", null, ],
		["24", "i", "7", "8", "ö", "r", "a", "17", "j", null, ],
		[null, "6", "e", "c", "h", "o", null, "14", "o", null, ],
		["21", "t", null, "20", "1", "b", "o", "h", "r", null, ],
		["4", "v", "a", "c", "c", "i", "n", "18", "n", null, ],
		[null, "3", "p", "a", "y", "n", "e", null, null, null, ],
		[null, null, null, null, null, null, null, null, null, null, ],
	],
horizontalClues: [
{ number: 1, clue: "dansk atomfysiker" }, 
{ number: 3, clue: "förklarade stjärnors sammansättning" }, 
{ number: 4, clue: "skydd mot sjukdom" }, 
{ number: 6, clue: "marvelhjältinna som imiterar" }, 
{ number: 8, clue: "hörselorgan" }, 
{ number: 10, clue: "ai för videoeffekter" }, 
{ number: 11, clue: "kartlade havsbottnen" }, 
{ number: 14, clue: "vokal formad som sig själv" }, 
{ number: 16, clue: "sci-fi jedimästare" }, 
{ number: 17, clue: "börjar ordet ja" }, 
{ number: 18, clue: "först i nej" }, 
{ number: 21, clue: "finns i te" }, 
{ number: 24, clue: "liten vokal med prick" }, 
],  
verticalClues: [
{ number: 2, clue: "assistenten som aldrig får bilen" }, 
{ number: 5, clue: "sjöng Waterloo och mycket annat" }, 
{ number: 6, clue: "bildskärm i vardagsrum" }, 
{ number: 7, clue: "vokalernas arbetshäst" }, 
{ number: 8, clue: "vanlig i engelsk stavning" }, 
{ number: 9, clue: "flaska i slang" }, 
{ number: 10, clue: "kinesisk språkmodell" }, 
{ number: 12, clue: "hugger ved" }, 
{ number: 14, clue: "bokstav i hus" }, 
{ number: 15, clue: "kroppens yttre lager" }, 
{ number: 20, clue: "när exakthet känns överskattat" }, 
]
};

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            const clueBox = document.createElement("div");
            clueBox.classList.add("clueBox");
            clueBox.textContent = sol_content;
            cell.appendChild(clueBox);
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const horizontalClueList = document.getElementById("horizontalClueList");
crossword.horizontalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    horizontalClueList.appendChild(li);
});

const verticalClueList = document.getElementById("verticalClueList");
crossword.verticalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    verticalClueList.appendChild(li);
});

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value != "") {
            if (input.value.toUpperCase() === correct) {
                input.classList.remove("incorrect");
                input.classList.add("correct");
            } else {
                input.classList.remove("correct");
                input.classList.add("incorrect");
            }
        }
    });
});

function isNumber(str){
    const tryNum = Number(str);
    return !isNaN(tryNum);
}
</script>

</body>
</html>
