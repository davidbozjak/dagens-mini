<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily SE Mini Sunday, 2026-11-01</title>

    <style>
    :root {
        --grid-size: min(90vw, 520px);
        --cell-size: calc(var(--grid-size) / 10);

        --radius: 12px;

        --blue: #2563eb;
        --blue-dark: #1d4ed8;
        --blue-light: #dbeafe;

        --border: #cbd5e1;
        --text: #1e293b;
        --text-secondary: #64748b;

        --success: #0cff0c1a;
        --error: #fee2e2;
    }

    body {
        font-family:
            Inter,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            sans-serif;

        background: #f8fafc;
        color: var(--text);

        max-width: 900px;
        margin: 0 auto;
        padding: 24px 16px;

        line-height: 1.5;
    }

    h2 {
        text-align: center;
        margin-bottom: 24px;
        font-size: clamp(1.5rem, 5vw, 2rem);
    }

    h3 {
        margin-top: 1.5rem;
    }

    /* Crossword */

    #grid {
        --cell-size: calc(min(90vw, 520px) / var(--cols));

        display: grid;
        grid-template-columns: repeat(var(--cols), var(--cell-size));

        width: max-content;
        margin: 0 auto;

        padding: 6px;
        gap: 2px;

        background: var(--border);
        border-radius: var(--radius);
    }

    .cell {
        aspect-ratio: 1;

        background: white;
        border: 1px solid var(--border);

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;
        box-sizing: border-box;
    }

    .cell input {
        width: 100%;
        height: 100%;

        border: none;
        outline: none;

        background: transparent;

        text-align: center;
        text-transform: uppercase;

        font-size: clamp(16px, 4vw, 26px);
        font-weight: 600;
    }

    .clue-cell {
        background: var(--blue-light);
        color: #1e3a8a;

        font-size: clamp(14px, 3vw, 22px);
        font-weight: 700;
    }

    .transparent {
        background: none;
        border: none;
    }

    .cell input.correct {
        background: var(--success);
    }

    .cell input.incorrect {
        background: var(--error);
    }

    /* Clues */

    #Ledtrådar {
        margin-top: 32px;
        padding: 20px;

        background: white;
        border-radius: var(--radius);

        box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    #Ledtrådar ul {
        padding-left: 20px;
    }

    #Ledtrådar li {
        margin-bottom: 8px;
    }

    /* Buttons */

    #validateBtn,
    .toggle-button,
    .submit-button {
        border: none;
        cursor: pointer;

        transition:
            background .2s ease,
            transform .15s ease;
    }

    #validateBtn:hover,
    .toggle-button:hover,
    .submit-button:hover {
        transform: translateY(-1px);
    }

    #validateBtn:active,
    .toggle-button:active,
    .submit-button:active {
        transform: translateY(0);
    }

    #validateBtn {
        display: block;

        margin: 24px auto;
        padding: 12px 24px;

        background: var(--blue);
        color: white;

        border-radius: 10px;

        font-size: 16px;
        font-weight: 600;
    }

    .toggle-button,
    .submit-button {
        background: var(--blue);
        color: white;
    }

    .toggle-button:hover,
    .submit-button:hover {
        background: var(--blue-dark);
    }

    .submit-button {
        flex-shrink: 0;

        padding: 8px 14px;

        border-radius: 6px;
        font-weight: 600;
    }

    .submit-button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
    }

    /* Accessibility */

    input:focus,
    button:focus-visible {
        outline: 3px solid #60a5fa;
        outline-offset: 2px;
    }

    /* AI Section */

    .toolbar {
        margin-bottom: 12px;
    }

    .component-list {
        display: flex;
        flex-direction: column;
        gap: 12px;

        overflow: hidden;

        max-height: 1000px;
        opacity: 1;

        transition:
            max-height .3s ease,
            opacity .3s ease;
    }

    .component-list.collapsed {
        max-height: 0;
        opacity: 0;
    }

    .submit-component {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 12px;

        padding: 14px;

        background: white;

        border: 1px solid #e2e8f0;
        border-radius: var(--radius);

        box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
    }

    .submit-content {
        flex: 1 1 250px;

        overflow-wrap: anywhere;
        word-break: break-word;
    }

    .secondary {
        color: var(--text-secondary);
    }

    .archive-link-container {
        text-align: center;
        margin: 16px 0 32px;
    }

    .archive-link {
        display: inline-block;

        padding: 10px 18px;

        color: var(--blue);
        background: white;

        border: 1px solid var(--border);
        border-radius: var(--radius);

        font-weight: 600;
        text-decoration: none;

        transition:
            background .2s ease,
            border-color .2s ease,
            transform .15s ease;
    }

    .archive-link:hover {
        background: #f1f5f9;
        border-color: var(--blue);

        transform: translateY(-1px);
    }

    .archive-link:active {
        transform: translateY(0);
    }
    </style>
</head>
<body>

<h2>Daily SE Mini Sunday, 2026-11-01</h2>

<div id="grid"></div>

<button id="validateBtn">Validate</button>

<div id="Ledtrådar">
    <h3>Vågrätt</h3>
    <ul id="horizontalClueList"></ul>
    <h3>Lodrätt</h3>
    <ul id="verticalClueList"></ul>
</div>

<div class="archive-link-container">
    <a href="./archive/index.html" class="archive-link">
        📚 Browse Puzzle Archive
    </a>
</div>

<div class="toolbar">
    <button id="toggleButton" class="toggle-button">
        Show AI Generated Clues
    </button>
</div>

<div id="aiGenClueList" class="component-list collapsed"></div>

<script>
// ------------------------------
// Crossword Data Structure
// ------------------------------
    const crossword = {
        	cols: 10, 
	rows: 10, 
solution: [ 
		[null, "22", "21", "10", null, "6", "5", "2", null, null, ],
		["15", "o", "b", "s", "28", "s", "u", "g", "14", null, ],
		[null, "9", "20", "e", "4", "k", "r", "o", "m", null, ],
		["8", "n", "o", "r", "r", "a", "31", "o", "u", null, ],
		["11", "i", "26", "b", "e", "t", "7", "d", "n", null, ],
		["13", "c", "19", "i", "x", "t", "a", "a", "3", null, ],
		["17", "e", "v", "e", null, "29", "s", "l", "b", null, ],
		[null, "18", "i", "n", "1", "v", "a", "l", "e", null, ],
		["23", "e", "n", null, "12", "k", "r", "33", "n", null, ],
		[null, null, null, null, null, null, null, null, null, null, ],
	],
        horizontalClues: [
{ number: 1, clue: "gud som hämnar Balder" }, 
{ number: 4, clue: "ger blank yta" }, 
{ number: 7, clue: "Inledningen på ordet 'dina'" }, 
{ number: 8, clue: "Motsats till södra" }, 
{ number: 11, clue: "liten vokal med prick" }, 
{ number: 12, clue: "står efter shoppingrundan" }, 
{ number: 13, clue: "vanlig i engelsk stavning" }, 
{ number: 15, clue: "något man helst inte missar" }, 
{ number: 17, clue: "robot i WALL-E" }, 
{ number: 18, clue: "motsats till ut" }, 
{ number: 19, clue: "Kombinationen som dansar på tangenterna, men inte bildar ett riktigt ord." }, 
{ number: 20, clue: "sveriges vanligaste vokal" }, 
{ number: 23, clue: "barrväxt med bär" }, 
{ number: 26, clue: "Satsa något i hopp om vinst" }, 
{ number: 28, clue: "Det du gör med ett sugrör" }, 
{ number: 29, clue: "Förkortning som tar dig runt i huvudstaden" }, 
{ number: 31, clue: "Vokalpaket från Frankrike" }, 
{ number: 33, clue: "Den näst sista bokstaven i alfabetet." }, 
],  
verticalClues: [
{ number: 2, clue: "berömd primatforskare" }, 
{ number: 3, clue: "kroppsdel" }, 
{ number: 4, clue: "polis med fyra ben" }, 
{ number: 5, clue: "kan tiden" }, 
{ number: 6, clue: "statlig avgift" }, 
{ number: 7, clue: "gudasläkte med Odin som ledare" }, 
{ number: 9, clue: "svenskarnas favoritengelska" }, 
{ number: 10, clue: "land på Balkan" }, 
{ number: 14, clue: "talorgan" }, 
{ number: 18, clue: "vokalernas arbetshäst" }, 
{ number: 19, clue: "dryck av druvor" }, 
{ number: 20, clue: "rund vokal" }, 
{ number: 21, clue: "tvåa bland bokstäverna" }, 
{ number: 22, clue: "dyker ofta upp mellan två namn" }, 
{ number: 29, clue: "Svenskarnas populära sociala nätverk förr i tiden" }, 
],
        ai_gen_clues: [
{ key: "bet", clue: "Satsa något i hopp om vinst", confidence: "95" }, 
{ key: "ixtaa", clue: "Kombinationen som dansar på tangenterna, men inte bildar ett riktigt ord.", confidence: "60" }, 
{ key: "sug", clue: "Det du gör med ett sugrör", confidence: "95" }, 
{ key: "slb", clue: "Förkortning som tar dig runt i huvudstaden", confidence: "85" }, 
{ key: "vk", clue: "Svenskarnas populära sociala nätverk förr i tiden", confidence: "85" }, 
{ key: "ou", clue: "Vokalpaket från Frankrike", confidence: "80" }, 
{ key: "dn", clue: "Inledningen på ordet 'dina'", confidence: "80" }, 
{ key: "n", clue: "Den näst sista bokstaven i alfabetet.", confidence: "95" }, 
]
    };

    let isAIGenSectionExpanded = false;

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");
grid.style.setProperty("--cols", 10);

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            cell.classList.add("clue-cell");
            cell.textContent = sol_content;
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const horizontalClueList = document.getElementById("horizontalClueList");
crossword.horizontalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    horizontalClueList.appendChild(li);
});

const verticalClueList = document.getElementById("verticalClueList");
crossword.verticalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    verticalClueList.appendChild(li);
});

// ------------------------------
// AI Generated Clues section
// ------------------------------

    const container = document.getElementById("aiGenClueList");
    const toggleButton = document.getElementById("toggleButton");

    function renderItems() {
        container.innerHTML = "";

        crossword.ai_gen_clues.forEach(item => {
            const component = document.createElement("div");

            component.className = "submit-component";

            component.innerHTML = `
                <div class="submit-content">
                    <b>${item.key}:</b>
                    ${item.clue}
                    <span class="secondary">(${item.confidence})</span>
                </div>

                <button
                    class="submit-button"
                    type="submit">
                    Godkänn
                </button>
            `;

            const button = component.querySelector(".submit-button");

            button.addEventListener("click", () => {
                submitClueToDB(button, item);
            });

            container.appendChild(component);
        });
    }

    function updateExpandedState() {
        container.classList.toggle("collapsed", !isAIGenSectionExpanded);

        toggleButton.textContent =
            isAIGenSectionExpanded ? "Stäng": "Visa AI genererade ledtrådar";
    }

    toggleButton.addEventListener("click", () => {
        isAIGenSectionExpanded = !isAIGenSectionExpanded;
        updateExpandedState();
    });

    async function submitClueToDB(button, item) {
        try {
            button.disabled = true;
            button.textContent = "...";

            const response = await fetch("https://sheetdb.io/api/v1/2ugi4z3mi964f", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    key: item.key,
                    clue: item.clue,
                    aI_gen_confidence: item.confidence
                })
            });

            if (!response.ok) {
                throw new Error("Request failed");
            }

            button.textContent = "Inskickad";
        }
        catch (error) {
            console.error(error);

            button.textContent = "Err";
        }
    }

    renderItems();
    updateExpandedState();

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value != "") {
            if (input.value.toUpperCase() === correct) {
                input.classList.remove("incorrect");
                input.classList.add("correct");
            } else {
                input.classList.remove("correct");
                input.classList.add("incorrect");
            }
        }
    });
    
    let all_correct = Array.from(inputs)
        .every(w => w.classList.contains("correct"));

    if (all_correct)
    {
        //todo: add some kind of celebration?

        const storage = loadStorageSet();
        storage.add("2026-11-01");
        saveStorageSet(storage);
    }
});

const STORAGE_KEY = "dagens-mini-completed-dates";

function loadStorageSet() {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) {
        return new Set();
    }

    return new Set(JSON.parse(raw));
}

function saveStorageSet(set) {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify([...set])
    );
}

function isNumber(str) {
    const tryNum = Number(str);
    return !isNaN(tryNum);
}
</script>

</body>
</html>
