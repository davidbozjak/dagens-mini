
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily SE Mini Thursday, 2026-10-29</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 600px;
        margin: auto;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(10, 40px);
        gap: 4px;
        justify-content: center;
    }

    .cell {
        width: 40px;
        height: 40px;
        border: 1px solid #aaa;
        text-align: center;
        font-size: 22px;
        position: relative;
    }

    .cell input {
        width: 90%;
        height: 90%;
        border: none;
        text-align: center;
        font-size: 22px;
    }

    .clueBox {
        width: 40px;
        height: 40px;
        background: #e0e0e0;
        font-size: 16px;
        display: flex;
        align-items: center;   /* vertical centering */
        justify-content: center; /* horizontal centering */
        position: absolute;
        top: 0;
        left: 0;
        border-bottom-right-radius: 6px;
    }

    .transparent {
        background: none;
        border: none;
    }

    #validateBtn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 18px;
    }

    .correct {
        background-color: #cce6ff !important; /* light blue */
    }

    .incorrect {
        background-color: #ffcccc !important; /* light red */
    }

    #clues {
        margin-top: 30px;
    }

    @media (max-width: 480px) {
        #grid {
            grid-template-columns: repeat(10, 32px);
        }
        .cell {
            width: 32px;
            height: 32px;
        }
        .cell input {
            font-size: 18px;
        }
    }
</style>
</head>
<body>

<h2>Daily SE Mini Thursday, 2026-10-29</h2>

<div id="grid"></div>

<button id="validateBtn">Validate</button>

<div id="Ledtrådar">
    <h3>Vågrätt</h3>
    <ul id="horizontalClueList"></ul>
    <h3>Lodrätt</h3>
    <ul id="verticalClueList"></ul>
</div>

<script>
// ------------------------------
// Crossword Data Structure
// ------------------------------
const crossword = {
	cols: 10, 
	rows: 10, 
solution: [ 
		[null, null, "5", "9", null, "4", "12", "15", null, null, ],
		[null, "22", "t", "å", "11", "w", "i", "l", null, null, ],
		["8", "b", "a", "k", "24", "a", "20", "19", "21", null, ],
		[null, "10", "l", "2", "14", "l", "e", "i", "f", null, ],
		[null, "b", "l", "h", "13", "t", "v", "7", "i", null, ],
		[null, "a", "r", "u", "3", "e", "6", "c", "l", null, ],
		["1", "m", "i", "n", "e", "r", "v", "a", null, null, ],
		[null, "s", "k", "d", "k", null, "ä", "s", null, null, ],
		["18", "e", null, null, null, null, "n", "h", null, null, ],
		[null, null, null, null, null, null, null, null, null, null, ],
	],
horizontalClues: [
{ number: 1, clue: "vishetens gudinna" }, 
{ number: 3, clue: "sveriges vanligaste vokal" }, 
{ number: 6, clue: "vanligt på restaurangnotan" }, 
{ number: 8, clue: "motsats till fram" }, 
{ number: 10, clue: "först i lund" }, 
{ number: 11, clue: "hjälte i Shannara" }, 
{ number: 13, clue: "bildskärm i vardagsrum" }, 
{ number: 14, clue: "skriver deckare i massor" }, 
{ number: 18, clue: "vokalernas arbetshäst" }, 
{ number: 24, clue: "först ut i alfabetet" }, 
],  
verticalClues: [
{ number: 2, clue: "Bästa vän" }, 
{ number: 3, clue: "lövträd med ekollon" }, 
{ number: 4, clue: "android i Alien Covenant" }, 
{ number: 5, clue: "äter middag på" }, 
{ number: 6, clue: "skickar grattishälsningar" }, 
{ number: 7, clue: "engelskt ord för svensk bristvara" }, 
{ number: 9, clue: "det du tar dig fram i" }, 
{ number: 10, clue: "världens starkaste honungsätare" }, 
{ number: 12, clue: "ser ut som ett utrop med prick" }, 
{ number: 15, clue: "finns mitt i ölglas" }, 
{ number: 19, clue: "liten vokal med prick" }, 
{ number: 20, clue: "när något kanske händer" }, 
{ number: 21, clue: "jämnar ut metall" }, 
{ number: 22, clue: "tvåa bland bokstäverna" }, 
]
};

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            const clueBox = document.createElement("div");
            clueBox.classList.add("clueBox");
            clueBox.textContent = sol_content;
            cell.appendChild(clueBox);
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const horizontalClueList = document.getElementById("horizontalClueList");
crossword.horizontalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    horizontalClueList.appendChild(li);
});

const verticalClueList = document.getElementById("verticalClueList");
crossword.verticalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    verticalClueList.appendChild(li);
});

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value != "") {
            if (input.value.toUpperCase() === correct) {
                input.classList.remove("incorrect");
                input.classList.add("correct");
            } else {
                input.classList.remove("correct");
                input.classList.add("incorrect");
            }
        }
    });
});

function isNumber(str){
    const tryNum = Number(str);
    return !isNaN(tryNum);
}
</script>

</body>
</html>
