
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily SE Mini Thursday, 2026-10-29</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 600px;
        margin: auto;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(10, 40px);
        gap: 4px;
        justify-content: center;
    }

    .cell {
        width: 40px;
        height: 40px;
        border: 1px solid #aaa;
        text-align: center;
        font-size: 22px;
        position: relative;
    }

    .cell input {
        width: 90%;
        height: 90%;
        border: none;
        text-align: center;
        font-size: 22px;
    }

    .clueBox {
        width: 40px;
        height: 40px;
        background: #e0e0e0;
        font-size: 16px;
        display: flex;
        align-items: center;   /* vertical centering */
        justify-content: center; /* horizontal centering */
        position: absolute;
        top: 0;
        left: 0;
        border-bottom-right-radius: 6px;
    }

    .transparent {
        background: none;
        border: none;
    }

    #validateBtn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 18px;
    }

    .correct {
        background-color: #cce6ff !important; /* light blue */
    }

    .incorrect {
        background-color: #ffcccc !important; /* light red */
    }

    #clues {
        margin-top: 30px;
    }

    @media (max-width: 480px) {
        #grid {
            grid-template-columns: repeat(10, 32px);
        }
        .cell {
            width: 32px;
            height: 32px;
        }
        .cell input {
            font-size: 18px;
        }
    }
</style>
</head>
<body>

<h2>Daily SE Mini Thursday, 2026-10-29</h2>

<div id="grid"></div>

<button id="validateBtn">Validate</button>

<div id="Ledtrådar">
    <h3>Vågrätt</h3>
    <ul id="horizontalClueList"></ul>
    <h3>Lodrätt</h3>
    <ul id="verticalClueList"></ul>
</div>

<script>
// ------------------------------
// Crossword Data Structure
// ------------------------------
const crossword = {
	cols: 10, 
	rows: 10, 
solution: [ 
		[null, null, "24", "20", "2", null, "5", null, null, null, ],
		["16", "e", "p", "i", "c", "8", "d", "y", "r", null, ],
		[null, "4", "6", "3", "e", "r", "i", "k", "a", null, ],
		["1", "s", "m", "å", "l", "f", "o", "t", null, null, ],
		[null, "ä", "e", "s", "e", "15", "n", null, null, null, ],
		[null, "n", "n", "18", "b", "14", "y", null, "17", null, ],
		[null, "g", "d", "e", "i", "11", "s", "i", "l", null, ],
		[null, "7", "e", "v", "10", "t", "o", "g", "o", null, ],
		["9", "f", "l", "e", "x", "12", "s", null, null, null, ],
		[null, null, null, null, null, null, null, null, null, null, ],
	],
horizontalClues: [
{ number: 1, clue: "liten vän till Asterix" }, 
{ number: 3, clue: "författare i Fjällbackaserien" }, 
{ number: 7, clue: "när något kanske händer" }, 
{ number: 8, clue: "motsats till billig" }, 
{ number: 9, clue: "skryt maskerat som information" }, 
{ number: 10, clue: "västafrikanskt land" }, 
{ number: 11, clue: "köksredskap med hål" }, 
{ number: 12, clue: "slingrig bokstav" }, 
{ number: 14, clue: "sista vanliga vokalen" }, 
{ number: 15, clue: "bokstav i november" }, 
{ number: 16, clue: "större än nödvändigt" }, 
{ number: 18, clue: "kommer efter a" }, 
],  
verticalClues: [
{ number: 2, clue: "tidsresenär från skogen" }, 
{ number: 3, clue: "höjdrygg" }, 
{ number: 4, clue: "möbel för sömn" }, 
{ number: 5, clue: "vinets gud" }, 
{ number: 6, clue: "genetikens fader" }, 
{ number: 7, clue: "bokstav i fika" }, 
{ number: 10, clue: "bokstav för det okända" }, 
{ number: 11, clue: "finns i te" }, 
{ number: 17, clue: "svenskt rovdjur" }, 
{ number: 18, clue: "robot i WALL-E" }, 
{ number: 20, clue: "liten vokal med prick" }, 
{ number: 24, clue: "finns i pappa" }, 
]
};

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            const clueBox = document.createElement("div");
            clueBox.classList.add("clueBox");
            clueBox.textContent = sol_content;
            cell.appendChild(clueBox);
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const horizontalClueList = document.getElementById("horizontalClueList");
crossword.horizontalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    horizontalClueList.appendChild(li);
});

const verticalClueList = document.getElementById("verticalClueList");
crossword.verticalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    verticalClueList.appendChild(li);
});

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value != "") {
            if (input.value.toUpperCase() === correct) {
                input.classList.remove("incorrect");
                input.classList.add("correct");
            } else {
                input.classList.remove("correct");
                input.classList.add("incorrect");
            }
        }
    });
});

function isNumber(str){
    const tryNum = Number(str);
    return !isNaN(tryNum);
}
</script>

</body>
</html>
