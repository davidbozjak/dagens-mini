
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily SE Mini Thursday, 2026-10-29</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 600px;
        margin: auto;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(10, 40px);
        gap: 4px;
        justify-content: center;
    }

    .cell {
        width: 40px;
        height: 40px;
        border: 1px solid #aaa;
        text-align: center;
        font-size: 22px;
        position: relative;
    }

    .cell input {
        width: 90%;
        height: 90%;
        border: none;
        text-align: center;
        font-size: 22px;
    }

    .clueBox {
        width: 40px;
        height: 40px;
        background: #e0e0e0;
        font-size: 16px;
        display: flex;
        align-items: center;   /* vertical centering */
        justify-content: center; /* horizontal centering */
        position: absolute;
        top: 0;
        left: 0;
        border-bottom-right-radius: 6px;
    }

    .transparent {
        background: none;
        border: none;
    }

    #validateBtn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 18px;
    }

    .correct {
        background-color: #cce6ff !important; /* light blue */
    }

    .incorrect {
        background-color: #ffcccc !important; /* light red */
    }

    #clues {
        margin-top: 30px;
    }

    @media (max-width: 480px) {
        #grid {
            grid-template-columns: repeat(10, 32px);
        }
        .cell {
            width: 32px;
            height: 32px;
        }
        .cell input {
            font-size: 18px;
        }
    }
</style>
</head>
<body>

<h2>Daily SE Mini Thursday, 2026-10-29</h2>

<div id="grid"></div>

<button id="validateBtn">Validate</button>

<div id="Ledtrådar">
    <h3>Vågrätt</h3>
    <ul id="horizontalClueList"></ul>
    <h3>Lodrätt</h3>
    <ul id="verticalClueList"></ul>
</div>

<script>
// ------------------------------
// Crossword Data Structure
// ------------------------------
const crossword = {
	cols: 10, 
	rows: 10, 
solution: [ 
		[null, "24", "12", "25", "27", null, null, null, null, null, ],
		["14", "m", "ö", "r", "k", null, "3", null, "2", null, ],
		[null, "10", "g", "15", "19", "17", "c", "4", "b", null, ],
		["11", "n", "a", "s", "h", null, "o", "c", "r", null, ],
		["28", "ä", "9", "u", "6", null, "r", "h", "e", null, ],
		[null, "s", "s", "n", "s", "1", "t", "i", "e", null, ],
		["8", "a", "t", "o", "m", null, "a", "l", "23", null, ],
		[null, "13", "y", "7", "e", "20", "n", "e", "j", null, ],
		["18", "y", "x", "5", "d", "n", "a", "29", "a", null, ],
		[null, null, null, null, null, null, null, null, null, null, ],
	],
horizontalClues: [
{ number: 1, clue: "kejserligt jaktplan" }, 
{ number: 4, clue: "kommer efter a" }, 
{ number: 5, clue: "arvsmolekyl" }, 
{ number: 7, clue: "sveriges vanligaste vokal" }, 
{ number: 8, clue: "materiens byggsten" }, 
{ number: 9, clue: "vokalen mellan t och v" }, 
{ number: 10, clue: "bokstav i godis" }, 
{ number: 11, clue: "nobelpristagare i ekonomi" }, 
{ number: 13, clue: "sista vanliga vokalen" }, 
{ number: 14, clue: "Motsats till ljus" }, 
{ number: 17, clue: "vanlig i engelsk stavning" }, 
{ number: 18, clue: "hugger ved" }, 
{ number: 20, clue: "motsats till ja" }, 
{ number: 28, clue: "vokalen före ö" }, 
{ number: 29, clue: "först ut i alfabetet" }, 
],  
verticalClues: [
{ number: 2, clue: "by i Midgård" }, 
{ number: 3, clue: "sci-fi AI i Halo" }, 
{ number: 4, clue: "långsmalt land i Sydamerika" }, 
{ number: 6, clue: "arbetar med metall" }, 
{ number: 9, clue: "flod till dödsriket" }, 
{ number: 10, clue: "luktorgan" }, 
{ number: 12, clue: "synorgan" }, 
{ number: 13, clue: "sista vanliga vokalen" }, 
{ number: 15, clue: "ai för musikskapande" }, 
{ number: 19, clue: "gömmer sig i hej" }, 
{ number: 20, clue: "först i nej" }, 
{ number: 23, clue: "positiv till förslaget" }, 
{ number: 24, clue: "mått för lite längre saker" }, 
{ number: 25, clue: "bokstav som många skorr" }, 
{ number: 27, clue: "först i kaffe" }, 
]
};

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            const clueBox = document.createElement("div");
            clueBox.classList.add("clueBox");
            clueBox.textContent = sol_content;
            cell.appendChild(clueBox);
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const horizontalClueList = document.getElementById("horizontalClueList");
crossword.horizontalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    horizontalClueList.appendChild(li);
});

const verticalClueList = document.getElementById("verticalClueList");
crossword.verticalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    verticalClueList.appendChild(li);
});

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value != "") {
            if (input.value.toUpperCase() === correct) {
                input.classList.remove("incorrect");
                input.classList.add("correct");
            } else {
                input.classList.remove("correct");
                input.classList.add("incorrect");
            }
        }
    });
});

function isNumber(str){
    const tryNum = Number(str);
    return !isNaN(tryNum);
}
</script>

</body>
</html>
