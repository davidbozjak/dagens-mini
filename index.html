<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily SE Mini Saturday, 2026-11-14</title>

    <style>
    :root {
        --grid-size: min(90vw, 520px);
        --cell-size: calc(var(--grid-size) / 10);

        --radius: 12px;

        --blue: #2563eb;
        --blue-dark: #1d4ed8;
        --blue-light: #dbeafe;

        --border: #cbd5e1;
        --text: #1e293b;
        --text-secondary: #64748b;

        --success: #0cff0c1a;
        --error: #fee2e2;
    }

    body {
        font-family:
            Inter,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            sans-serif;

        background: #f8fafc;
        color: var(--text);

        max-width: 900px;
        margin: 0 auto;
        padding: 24px 16px;

        line-height: 1.5;
    }

    h2 {
        text-align: center;
        margin-bottom: 24px;
        font-size: clamp(1.5rem, 5vw, 2rem);
    }

    h3 {
        margin-top: 1.5rem;
    }

    /* Crossword */

    #grid {
        --cell-size: calc(min(90vw, 520px) / var(--cols));

        display: grid;
        grid-template-columns: repeat(var(--cols), var(--cell-size));

        width: max-content;
        margin: 0 auto;

        padding: 6px;
        gap: 2px;

        background: var(--border);
        border-radius: var(--radius);
    }

    .cell {
        aspect-ratio: 1;

        background: white;
        border: 1px solid var(--border);

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;
        box-sizing: border-box;
    }

    .cell input {
        width: 100%;
        height: 100%;

        border: none;
        outline: none;

        background: transparent;

        text-align: center;
        text-transform: uppercase;

        font-size: clamp(16px, 4vw, 26px);
        font-weight: 600;
    }

    .clue-cell {
        background: var(--blue-light);
        color: #1e3a8a;

        font-size: clamp(14px, 3vw, 22px);
        font-weight: 700;
    }

    .transparent {
        background: none;
        border: none;
    }

    .cell input.correct {
        background: var(--success);
    }

    .cell input.incorrect {
        background: var(--error);
    }

    /* Clues */

    #Ledtrådar {
        margin-top: 32px;
        padding: 20px;

        background: white;
        border-radius: var(--radius);

        box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    #Ledtrådar ul {
        padding-left: 20px;
    }

    #Ledtrådar li {
        margin-bottom: 8px;
    }

    /* Buttons */

    #validateBtn,
    .toggle-button,
    .submit-button {
        border: none;
        cursor: pointer;

        transition:
            background .2s ease,
            transform .15s ease;
    }

    #validateBtn:hover,
    .toggle-button:hover,
    .submit-button:hover {
        transform: translateY(-1px);
    }

    #validateBtn:active,
    .toggle-button:active,
    .submit-button:active {
        transform: translateY(0);
    }

    #validateBtn {
        display: block;

        margin: 24px auto;
        padding: 12px 24px;

        background: var(--blue);
        color: white;

        border-radius: 10px;

        font-size: 16px;
        font-weight: 600;
    }

    .toggle-button,
    .submit-button {
        background: var(--blue);
        color: white;
    }

    .toggle-button:hover,
    .submit-button:hover {
        background: var(--blue-dark);
    }

    .submit-button {
        flex-shrink: 0;

        padding: 8px 14px;

        border-radius: 6px;
        font-weight: 600;
    }

    .submit-button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
    }

    /* Accessibility */

    input:focus,
    button:focus-visible {
        outline: 3px solid #60a5fa;
        outline-offset: 2px;
    }

    /* AI Section */

    .toolbar {
        margin-bottom: 12px;
    }

    .component-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .component-list.collapsed {
        display: none;
    }

    .submit-component {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 12px;

        padding: 14px;

        background: white;

        border: 1px solid #e2e8f0;
        border-radius: var(--radius);

        box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
    }

    .submit-content {
        flex: 1 1 250px;

        overflow-wrap: anywhere;
        word-break: break-word;
    }

    .secondary {
        color: var(--text-secondary);
    }

    .archive-link-container {
        text-align: center;
        margin: 16px 0 32px;
    }

    .archive-link {
        display: inline-block;

        padding: 10px 18px;

        color: var(--blue);
        background: white;

        border: 1px solid var(--border);
        border-radius: var(--radius);

        font-weight: 600;
        text-decoration: none;

        transition:
            background .2s ease,
            border-color .2s ease,
            transform .15s ease;
    }

    .archive-link:hover {
        background: #f1f5f9;
        border-color: var(--blue);

        transform: translateY(-1px);
    }

    .archive-link:active {
        transform: translateY(0);
    }
    </style>
</head>

    let isAIGenSectionExpanded = false;

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");
grid.style.setProperty("--cols", 14);

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            cell.classList.add("clue-cell");
            cell.textContent = sol_content;
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const horizontalClueList = document.getElementById("horizontalClueList");
crossword.horizontalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    horizontalClueList.appendChild(li);
});

const verticalClueList = document.getElementById("verticalClueList");
crossword.verticalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    verticalClueList.appendChild(li);
});

// ------------------------------
// AI Generated Clues section
// ------------------------------

    const container = document.getElementById("aiGenClueList");
    const toggleButton = document.getElementById("toggleButton");

    function renderItems() {
        container.innerHTML = "";

        crossword.ai_gen_clues.forEach(item => {
            const component = document.createElement("div");

            component.className = "submit-component";

            component.innerHTML = `
                <div class="submit-content">
                    <b>${item.key}:</b>
                    ${item.clue}
                    <span class="secondary">(${item.confidence})</span>
                </div>

                <button
                    class="submit-button"
                    type="submit">
                    Godkänn
                </button>
            `;

            const button = component.querySelector(".submit-button");

            button.addEventListener("click", () => {
                submitClueToDB(button, item);
            });

            container.appendChild(component);
        });
    }

    function updateExpandedState() {
        container.classList.toggle("collapsed", !isAIGenSectionExpanded);

        toggleButton.textContent =
            isAIGenSectionExpanded ? "Stäng": "Visa AI genererade ledtrådar";
    }

    toggleButton.addEventListener("click", () => {
        isAIGenSectionExpanded = !isAIGenSectionExpanded;
        updateExpandedState();
    });

    async function submitClueToDB(button, item) {
        try {
            button.disabled = true;
            button.textContent = "...";

            const response = await fetch("https://sheetdb.io/api/v1/2ugi4z3mi964f", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    key: item.key,
                    clue: item.clue,
                    aI_gen_confidence: item.confidence
                })
            });

            if (!response.ok) {
                throw new Error("Request failed");
            }

            button.textContent = "Inskickad";
        }
        catch (error) {
            console.error(error);

            button.textContent = "Err";
        }
    }

    renderItems();
    updateExpandedState();

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value != "") {
            if (input.value.toUpperCase() === correct) {
                input.classList.remove("incorrect");
                input.classList.add("correct");
            } else {
                input.classList.remove("correct");
                input.classList.add("incorrect");
            }
        }
    });
    
    let all_correct = Array.from(inputs)
        .every(w => w.classList.contains("correct"));

    if (all_correct)
    {
        //todo: add some kind of celebration?

        const storage = loadStorageSet();
        storage.add("2026-11-14");
        saveStorageSet(storage);
    }
});

// ------------------------------
// Fix the link to the archive page to work before & after the page gets moved to Archive
// ------------------------------
document.addEventListener("DOMContentLoaded", () => {
    const archiveLinkElement = document.getElementById("archive-link");

    archiveLinkElement.href = window.location.pathname.includes("/archive/")
            ? "index.html"
            : "archive/index.html";
});


// ------------------------------
// Helper methods
// ------------------------------

const STORAGE_KEY = "dagens-mini-completed-dates";

function loadStorageSet() {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) {
        return new Set();
    }

    return new Set(JSON.parse(raw));
}

function saveStorageSet(set) {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify([...set])
    );
}

function isNumber(str) {
    const tryNum = Number(str);
    return !isNaN(tryNum);
}
