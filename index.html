
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily SE Mini Saturday, 2026-10-31</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 600px;
        margin: auto;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(10, 40px);
        gap: 4px;
        justify-content: center;
    }

    .cell {
        width: 40px;
        height: 40px;
        border: 1px solid #aaa;
        text-align: center;
        font-size: 22px;
        position: relative;
    }

    .cell input {
        width: 90%;
        height: 90%;
        border: none;
        text-align: center;
        font-size: 22px;
    }

    .clueBox {
        width: 40px;
        height: 40px;
        background: #e0e0e0;
        font-size: 16px;
        display: flex;
        align-items: center;   /* vertical centering */
        justify-content: center; /* horizontal centering */
        position: absolute;
        top: 0;
        left: 0;
        border-bottom-right-radius: 6px;
    }

    .transparent {
        background: none;
        border: none;
    }

    #validateBtn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 18px;
    }

    .correct {
        background-color: #cce6ff !important; /* light blue */
    }

    .incorrect {
        background-color: #ffcccc !important; /* light red */
    }

    #clues {
        margin-top: 30px;
    }

    @media (max-width: 480px) {
        #grid {
            grid-template-columns: repeat(10, 32px);
        }
        .cell {
            width: 32px;
            height: 32px;
        }
        .cell input {
            font-size: 18px;
        }
    }

    .toolbar {
        margin-bottom: 12px;
    }

    .toggle-button {
        background: #475569;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
    }

    .component-list {
        display: flex;
        flex-direction: column;
        gap: 12px;

        overflow: hidden;

        transition:
            max-height 0.3s ease,
            opacity 0.3s ease;
    }

    .component-list.collapsed {
        max-height: 0;
        opacity: 0;
    }

    .component-list:not(.collapsed) {
        max-height: 1000px;
        opacity: 1;
    }

    .submit-component {
        display: flex;
        align-items: center;
        gap: 16px;

        padding: 10px 16px;

        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
    }

    .submit-content {
        flex: 1;
        min-width: 0;

        color: #334155;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .secondary {
        color: #64748b;
    }

    .submit-button {
        flex-shrink: 0;

        background: #2563eb;
        color: white;

        border: none;
        border-radius: 6px;

        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
    }

    .submit-button:hover {
        background: #1d4ed8;
    }

    .submit-button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
    }
</style>
</head>
<body>

<h2>Daily SE Mini Saturday, 2026-10-31</h2>

<div id="grid"></div>

<button id="validateBtn">Validate</button>

<div id="Ledtrådar">
    <h3>Vågrätt</h3>
    <ul id="horizontalClueList"></ul>
    <h3>Lodrätt</h3>
    <ul id="verticalClueList"></ul>
</div>

<div class="toolbar">
    <button id="toggleButton" class="toggle-button">
        Show AI Generated Clues
    </button>
</div>

<div id="aiGenClueList" class="component-list collapsed"></div>

<script>
// ------------------------------
// Crossword Data Structure
// ------------------------------
    const crossword = {
        	cols: 10, 
	rows: 10, 
solution: [ 
		[null, null, null, null, null, null, null, "3", null, null, ],
		[null, null, null, null, null, null, "7", "p", "2", null, ],
		[null, null, null, null, "20", "17", "j", "i", "t", null, ],
		[null, null, "19", "4", "j", "o", "o", "n", "a", null, ],
		[null, "6", "ö", "g", "a", "22", "u", "s", "n", null, ],
		["5", "f", "u", "l", "l", "10", "l", "i", "i", null, ],
		["13", "i", "1", "a", "n", "d", "e", "r", "s", null, ],
		["15", "l", "9", "s", "e", "n", "12", "18", null, null, ],
		[null, null, null, "11", "t", "a", "n", "d", null, null, ],
		[null, null, null, null, null, null, null, null, null, null, ],
	],
        horizontalClues: [
{ number: 1, clue: "varje julafton på tv" }, 
{ number: 4, clue: "polis i Kepler-böckerna" }, 
{ number: 5, clue: "motsats till tom" }, 
{ number: 6, clue: "synorgan" }, 
{ number: 7, clue: "början på pengar" }, 
{ number: 9, clue: "nobelpristagare inom utvecklingsekonomi" }, 
{ number: 10, clue: "Romerskt för tjugoett minus tjugo" }, 
{ number: 11, clue: "finns i munnen" }, 
{ number: 13, clue: "ser ut som ett utrop med prick" }, 
{ number: 15, clue: "finns mitt i ölglas" }, 
{ number: 17, clue: "Snabb liten shop för kodare" }, 
{ number: 22, clue: "Förkortning som kan stå för en amerikansk marina" }, 
],  
verticalClues: [
{ number: 2, clue: "halvalv i Dragonlance" }, 
{ number: 3, clue: "insekt med skrämmande käkar" }, 
{ number: 4, clue: "dricker vatten ur" }, 
{ number: 6, clue: "jämnar ut metall" }, 
{ number: 7, clue: "energienhet" }, 
{ number: 10, clue: "arvsmolekyl" }, 
{ number: 12, clue: "bokstav i november" }, 
{ number: 17, clue: "vokal formad som sig själv" }, 
{ number: 18, clue: "kommer efter c" }, 
{ number: 19, clue: "Sällsynt par på tangentbordet, börjar med en ö" }, 
{ number: 20, clue: "Accessväg för mysterier på nätet" }, 
],
        ai_gen_clues: [
{ key: "öu", clue: "Sällsynt par på tangentbordet, börjar med en ö", confidence: "55" }, 
{ key: "jalnet", clue: "Accessväg för mysterier på nätet", confidence: "85" }, 
{ key: "jit", clue: "Snabb liten shop för kodare", confidence: "75" }, 
{ key: "usn", clue: "Förkortning som kan stå för en amerikansk marina", confidence: "70" }, 
{ key: "lii", clue: "Romerskt för tjugoett minus tjugo", confidence: "85" }, 
]
    };

    let isAIGenSectionExpanded = false;

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            const clueBox = document.createElement("div");
            clueBox.classList.add("clueBox");
            clueBox.textContent = sol_content;
            cell.appendChild(clueBox);
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const horizontalClueList = document.getElementById("horizontalClueList");
crossword.horizontalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    horizontalClueList.appendChild(li);
});

const verticalClueList = document.getElementById("verticalClueList");
crossword.verticalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    verticalClueList.appendChild(li);
});

// ------------------------------
// AI Generated Clues section
// ------------------------------

    const container = document.getElementById("aiGenClueList");
    const toggleButton = document.getElementById("toggleButton");

    function renderItems() {
        container.innerHTML = "";

        crossword.ai_gen_clues.forEach(item => {
            const component = document.createElement("div");

            component.className = "submit-component";

            component.innerHTML = `
                <div class="submit-content">
                    <b>${item.key}:</b>
                    ${item.clue}
                    <span class="secondary">(${item.confidence})</span>
                </div>

                <button
                    class="submit-button"
                    type="submit">
                    Godkänn
                </button>
            `;

            const button = component.querySelector(".submit-button");

            button.addEventListener("click", () => {
                submitClueToDB(button, item);
            });

            container.appendChild(component);
        });
    }

    function updateExpandedState() {
        container.classList.toggle("collapsed", !isAIGenSectionExpanded);

        toggleButton.textContent =
            isAIGenSectionExpanded ? "Stäng": "Visa AI genererade ledtrådar";
    }

    toggleButton.addEventListener("click", () => {
        isAIGenSectionExpanded = !isAIGenSectionExpanded;
        updateExpandedState();
    });

    async function submitClueToDB(button, item) {
        try {
            button.disabled = true;
            button.textContent = "...";

            const response = await fetch("https://sheetdb.io/api/v1/2ugi4z3mi964f", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    key: item.key,
                    clue: item.clue,
                    aI_gen_confidence: item.confidence
                })
            });

            if (!response.ok) {
                throw new Error("Request failed");
            }

            button.textContent = "Inskickad";
        }
        catch (error) {
            console.error(error);

            button.textContent = "Err";
        }
    }

    renderItems();
    updateExpandedState();

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value != "") {
            if (input.value.toUpperCase() === correct) {
                input.classList.remove("incorrect");
                input.classList.add("correct");
            } else {
                input.classList.remove("correct");
                input.classList.add("incorrect");
            }
        }
    });
});

function isNumber(str){
    const tryNum = Number(str);
    return !isNaN(tryNum);
}
</script>

</body>
</html>
