
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily SE Mini Saturday, 2026-10-31</title>

    <style>
    :root {
        --grid-size: min(90vw, 520px);
        --cell-size: calc(var(--grid-size) / 10);

        --radius: 12px;

        --blue: #2563eb;
        --blue-dark: #1d4ed8;
        --blue-light: #dbeafe;

        --border: #cbd5e1;
        --text: #1e293b;
        --text-secondary: #64748b;

        --success: #0cff0c1a;
        --error: #fee2e2;
    }

    body {
        font-family:
            Inter,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            sans-serif;

        background: #f8fafc;
        color: var(--text);

        max-width: 900px;
        margin: 0 auto;
        padding: 24px 16px;

        line-height: 1.5;
    }

    h2 {
        text-align: center;
        margin-bottom: 24px;
        font-size: clamp(1.5rem, 5vw, 2rem);
    }

    h3 {
        margin-top: 1.5rem;
    }

    /* Crossword */

    #grid {
        --cell-size: calc(min(90vw, 520px) / var(--cols));

        display: grid;
        grid-template-columns: repeat(var(--cols), var(--cell-size));

        width: max-content;
        margin: 0 auto;

        padding: 6px;
        gap: 2px;

        background: var(--border);
        border-radius: var(--radius);
    }

    .cell {
        aspect-ratio: 1;

        background: white;
        border: 1px solid var(--border);

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;
        box-sizing: border-box;
    }

    .cell input {
        width: 100%;
        height: 100%;

        border: none;
        outline: none;

        background: transparent;

        text-align: center;
        text-transform: uppercase;

        font-size: clamp(16px, 4vw, 26px);
        font-weight: 600;
    }

    .clue-cell {
        background: var(--blue-light);
        color: #1e3a8a;

        font-size: clamp(14px, 3vw, 22px);
        font-weight: 700;
    }

    .transparent {
        background: none;
        border: none;
    }

    .cell input.correct {
        background: var(--success);
    }

    .cell input.incorrect {
        background: var(--error);
    }

    /* Clues */

    #Ledtrådar {
        margin-top: 32px;
        padding: 20px;

        background: white;
        border-radius: var(--radius);

        box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    #Ledtrådar ul {
        padding-left: 20px;
    }

    #Ledtrådar li {
        margin-bottom: 8px;
    }

    /* Buttons */

    #validateBtn,
    .toggle-button,
    .submit-button {
        border: none;
        cursor: pointer;

        transition:
            background .2s ease,
            transform .15s ease;
    }

    #validateBtn:hover,
    .toggle-button:hover,
    .submit-button:hover {
        transform: translateY(-1px);
    }

    #validateBtn:active,
    .toggle-button:active,
    .submit-button:active {
        transform: translateY(0);
    }

    #validateBtn {
        display: block;

        margin: 24px auto;
        padding: 12px 24px;

        background: var(--blue);
        color: white;

        border-radius: 10px;

        font-size: 16px;
        font-weight: 600;
    }

    .toggle-button,
    .submit-button {
        background: var(--blue);
        color: white;
    }

    .toggle-button:hover,
    .submit-button:hover {
        background: var(--blue-dark);
    }

    .submit-button {
        flex-shrink: 0;

        padding: 8px 14px;

        border-radius: 6px;
        font-weight: 600;
    }

    .submit-button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
    }

    /* Accessibility */

    input:focus,
    button:focus-visible {
        outline: 3px solid #60a5fa;
        outline-offset: 2px;
    }

    /* AI Section */

    .toolbar {
        margin-bottom: 12px;
    }

    .component-list {
        display: flex;
        flex-direction: column;
        gap: 12px;

        overflow: hidden;

        max-height: 1000px;
        opacity: 1;

        transition:
            max-height .3s ease,
            opacity .3s ease;
    }

    .component-list.collapsed {
        max-height: 0;
        opacity: 0;
    }

    .submit-component {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 12px;

        padding: 14px;

        background: white;

        border: 1px solid #e2e8f0;
        border-radius: var(--radius);

        box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
    }

    .submit-content {
        flex: 1 1 250px;

        overflow-wrap: anywhere;
        word-break: break-word;
    }

    .secondary {
        color: var(--text-secondary);
    }
    </style>
</head>
<body>

<h2>Daily SE Mini Saturday, 2026-10-31</h2>

<div id="grid"></div>

<button id="validateBtn">Validate</button>

<div id="Ledtrådar">
    <h3>Vågrätt</h3>
    <ul id="horizontalClueList"></ul>
    <h3>Lodrätt</h3>
    <ul id="verticalClueList"></ul>
</div>

<div class="toolbar">
    <button id="toggleButton" class="toggle-button">
        Show AI Generated Clues
    </button>
</div>

<div id="aiGenClueList" class="component-list collapsed"></div>

<script>
// ------------------------------
// Crossword Data Structure
// ------------------------------
    const crossword = {
        	cols: 10, 
	rows: 10, 
solution: [ 
		[null, "27", "15", "26", "10", "32", null, null, null, null, ],
		["11", "r", "a", "d", "o", "n", "5", "21", "20", null, ],
		[null, "13", "17", "6", "b", "i", "l", "b", "o", null, ],
		["12", "b", "ö", "r", "s", "2", "j", "8", "7", null, ],
		["28", "r", "18", "e", "3", "b", "u", "f", "f", null, ],
		["30", "i", "i", "n", "l", "j", "s", "i", "i", null, ],
		["14", "e", "n", "23", "e", "ö", "33", "l", "j", null, ],
		["29", "f", "4", "c", "i", "r", "i", "19", "i", null, ],
		[null, "1", "k", "l", "a", "n", "t", null, null, null, ],
		[null, null, null, null, null, null, null, null, null, null, ],
	],
        horizontalClues: [
{ number: 1, clue: "person med kreativ relation till misstag" }, 
{ number: 2, clue: "början på ja" }, 
{ number: 3, clue: "när favoritsaken blir bättre" }, 
{ number: 4, clue: "prinsessa i Witcher" }, 
{ number: 6, clue: "hobbit som fann ringen" }, 
{ number: 11, clue: "radioaktiv ädelgas" }, 
{ number: 12, clue: "marknadsplats för aktier" }, 
{ number: 14, clue: "barrväxt med bär" }, 
{ number: 18, clue: "vokalernas arbetshäst" }, 
{ number: 19, clue: "ser ut som ett utrop med prick" }, 
{ number: 23, clue: "En sällsynt ö som bara består av två bokstäver med prick." }, 
{ number: 28, clue: "viktigt ljud i motorer" }, 
{ number: 29, clue: "bokstav i fika" }, 
{ number: 30, clue: "Ovanlig kombination som skulle kunna vara ett kattnamn." }, 
{ number: 33, clue: "Bokstavskombination som börjar ord som ’ljus’" }, 
],  
verticalClues: [
{ number: 2, clue: "tennislegend med eget kalsongimperium" }, 
{ number: 3, clue: "sci-fi prinsessa från Star Wars" }, 
{ number: 4, clue: "första bokstaven i kung" }, 
{ number: 5, clue: "inte direkt goth" }, 
{ number: 6, clue: "samiskt dragdjur" }, 
{ number: 7, clue: "östat i Stilla havet" }, 
{ number: 8, clue: "jämnar ut metall" }, 
{ number: 10, clue: "något man helst inte missar" }, 
{ number: 13, clue: "ett dokument ingen läser noga" }, 
{ number: 15, clue: "alfabetets etta" }, 
{ number: 17, clue: "sista bokstaven i alfabetet" }, 
{ number: 18, clue: "motsats till ut" }, 
{ number: 20, clue: "vokal formad som sig själv" }, 
{ number: 21, clue: "tvåa bland bokstäverna" }, 
{ number: 23, clue: "vanligt på restaurangnotan" }, 
{ number: 26, clue: "kommer efter c" }, 
{ number: 27, clue: "bokstav som många skorr" }, 
{ number: 32, clue: "Andraperson plural i vardagligt tal" }, 
{ number: 33, clue: "Kortpronomen för något obestämt i engelskan" }, 
],
        ai_gen_clues: [
{ key: "iinljsii", clue: "Ovanlig kombination som skulle kunna vara ett kattnamn.", confidence: "40" }, 
{ key: "eö", clue: "En sällsynt ö som bara består av två bokstäver med prick.", confidence: "65" }, 
{ key: "ni", clue: "Andraperson plural i vardagligt tal", confidence: "95" }, 
{ key: "lj", clue: "Bokstavskombination som börjar ord som ’ljus’", confidence: "90" }, 
{ key: "it", clue: "Kortpronomen för något obestämt i engelskan", confidence: "90" }, 
]
    };

    let isAIGenSectionExpanded = false;

// ------------------------------
// Build the grid
// ------------------------------
const grid = document.getElementById("grid");
grid.style.setProperty("--cols", 10);

for (let r = 0; r < crossword.rows; r++) {
    for (let c = 0; c < crossword.cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");

        let sol_content = crossword.solution[r][c];

        if (sol_content === null) {
            cell.classList.add("transparent");
        }
        else if (isNumber(sol_content)) {
            cell.classList.add("clue-cell");
            cell.textContent = sol_content;
        } else {
            const input = document.createElement("input");
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);
        }

        grid.appendChild(cell);
    }
}

// ------------------------------
// Display clues
// ------------------------------
const horizontalClueList = document.getElementById("horizontalClueList");
crossword.horizontalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    horizontalClueList.appendChild(li);
});

const verticalClueList = document.getElementById("verticalClueList");
crossword.verticalClues.forEach(cl => {
    const li = document.createElement("li");
    li.textContent = `${cl.number}: ${cl.clue}`;
    verticalClueList.appendChild(li);
});

// ------------------------------
// AI Generated Clues section
// ------------------------------

    const container = document.getElementById("aiGenClueList");
    const toggleButton = document.getElementById("toggleButton");

    function renderItems() {
        container.innerHTML = "";

        crossword.ai_gen_clues.forEach(item => {
            const component = document.createElement("div");

            component.className = "submit-component";

            component.innerHTML = `
                <div class="submit-content">
                    <b>${item.key}:</b>
                    ${item.clue}
                    <span class="secondary">(${item.confidence})</span>
                </div>

                <button
                    class="submit-button"
                    type="submit">
                    Godkänn
                </button>
            `;

            const button = component.querySelector(".submit-button");

            button.addEventListener("click", () => {
                submitClueToDB(button, item);
            });

            container.appendChild(component);
        });
    }

    function updateExpandedState() {
        container.classList.toggle("collapsed", !isAIGenSectionExpanded);

        toggleButton.textContent =
            isAIGenSectionExpanded ? "Stäng": "Visa AI genererade ledtrådar";
    }

    toggleButton.addEventListener("click", () => {
        isAIGenSectionExpanded = !isAIGenSectionExpanded;
        updateExpandedState();
    });

    async function submitClueToDB(button, item) {
        try {
            button.disabled = true;
            button.textContent = "...";

            const response = await fetch("https://sheetdb.io/api/v1/2ugi4z3mi964f", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    key: item.key,
                    clue: item.clue,
                    aI_gen_confidence: item.confidence
                })
            });

            if (!response.ok) {
                throw new Error("Request failed");
            }

            button.textContent = "Inskickad";
        }
        catch (error) {
            console.error(error);

            button.textContent = "Err";
        }
    }

    renderItems();
    updateExpandedState();

// ------------------------------
// Validation logic
// ------------------------------
document.getElementById("validateBtn").addEventListener("click", () => {
    const inputs = document.querySelectorAll(".cell input");

    inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        const correct = crossword.solution[r][c].toUpperCase();

        if (input.value != "") {
            if (input.value.toUpperCase() === correct) {
                input.classList.remove("incorrect");
                input.classList.add("correct");
            } else {
                input.classList.remove("correct");
                input.classList.add("incorrect");
            }
        }
    });
});

function isNumber(str){
    const tryNum = Number(str);
    return !isNaN(tryNum);
}
</script>

</body>
</html>
